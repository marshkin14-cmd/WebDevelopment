    <script>
        /**
 * @param {number[]} nums
 * @return {number}
 */
var maximumProduct = function(nums) {
    if (nums.length == 3){
        return nums[0]*nums[1]*nums[2]
    }
    else{
        let firstL=[Math.abs(nums[0]), 0]
        let secondL=[-Infinity, 0]
        let thirdL=[-Infinity, 0]

        for (let i=1; i<nums.length; i++){
            if (Math.abs(nums[i])>firstL[0]){
                firstL[0] = Math.abs(nums[i])
                firstL[1] = i
            }
        }
        for (let i=1; i<nums.length; i++){
            if ((Math.abs(nums[i])>secondL[0]&&Math.abs(nums[i])<=firstL[0])&&i!=firstL[1]&&i!=secondL[1]){
                secondL[0] = Math.abs(nums[i])
                secondL[1] = i
            }
        }
        for (let i=1; i<nums.length; i++){
            if ((Math.abs(nums[i])>thirdL[0]&&Math.abs(nums[i])<=secondL[0])&&i!=secondL[1]&&i!=thirdL[1]){
                thirdL[0] =  Math.abs(nums[i])
                thirdL[1] = i
            }
        }

        return nums[firstL[1]]*nums[secondL[1]]*nums[thirdL[1]]
    }
};
    </script>
