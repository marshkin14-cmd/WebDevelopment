<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="cat" height="300" width="300">

    <button id="btn" onclick="getImage()">Get Cat</button>

    <script>
        fetch('')
        function getImage(){
            const catImage = document.getElementById("cat")

            fetch('https://api.thecatapi.com/v1/images/search')

            // successful
            .then( res => res.json())
            .then( data => catImage.src = data[0]["url"])

            // error
            .catch( err => console.log('Error Getting image', err))
        }
    </script>
</body>
</html>
