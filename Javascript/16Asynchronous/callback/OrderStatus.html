<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // callback hell
        function first(status, callback){
            console.log(`Order confirmed ${status}`)

            callback("Pizza", function(callback){
                console.log("Out for delivery")

                callback()
            })
        }
        first("OrderID123", function(status2, callback){
            console.log(`Preparing Food Items ${status2}`)

            callback(function(){
                console.log("Delivered")
            })
        })
    </script>
</body>
</html>
