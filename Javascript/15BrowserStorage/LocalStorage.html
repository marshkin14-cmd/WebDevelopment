<body>
    <script>
        // localstorage - acts like permanent storage, stores large data

        localStorage.clear()

        localStorage.setItem("John" , ["Hello", "Good Morning", "How are you", 123456789])
        localStorage.setItem("Cart", ["Shoes", "Tea", "Book"])

        const cartItem = localStorage.getItem("Cart")
        console.log(cartItem)
    </script>
