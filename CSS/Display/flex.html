<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            background-color: aqua;
            height: 600px;
            display: flex;
            flex-direction: row;
            justify-content: center;

            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        .box{
            background-color: maroon;
            width: 200px;
            height: 200px;
            border: 1px solid black;
            border-radius: 50%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">Cake</div>
        <div class="box">Pastry</div>
        <div class="box">Cookies</div>
    </div>
</body>
</html>
