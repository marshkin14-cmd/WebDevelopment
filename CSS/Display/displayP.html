<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mpy{
            display: none;
        }
        p{
            color: red;
        }
        #ex1{
            background-color: aqua;
            display: inline;
        }
        #ex2{
            background-color: blue;
            display: block;
        }
    </style>
</head>
<body>
    <p id="mpy">Hello BIG BILLION Day Sale is Live~!!!</p>

    <div>
        This is an example of Inline Display - Span Tag
        <p id="ex1">Hello Inline</p>
    </div>
    <div>
        This is an example of Block Display - Div Tag
        <p id="ex2">Hello Block</p>
    </div>
</body>
</html>
