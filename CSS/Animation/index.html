<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: red;
            animation-name: test;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }

        @keyframes test{
            0% {background-color: red; transform: translateX(0);}

            50% {background-color: yellow; transform: translateY(200px); border-radius: 50%; opacity: 0.09;}

            100% {background-color: brown; transform: translateX(0);}
        }
    </style>
</head>
<body>
    <div class="box">

    </div>

    <strong>Animation Effect goes back to original formafter completing</strong>
</body>
</html>
